

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Miss Aziza - So'z Yodlash Mashqlar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
    
    * {
      font-family: 'Poppins', sans-serif;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideIn {
      from { transform: translateX(-20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .animate-fade-in {
      animation: fadeIn 0.5s ease-out;
    }

    .animate-slide-in {
      animation: slideIn 0.3s ease-out;
    }

    /* Smooth transitions */
    button, input {
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Card styling */
    .card {
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.95);
    }

    .dark .card {
      background: rgba(15, 23, 42, 0.95);
    }

    /* Progress bar animation */
    .progress-bar {
      background: linear-gradient(90deg, #a78bfa, #f472b6);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    /* Input focus */
    input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.1);
    }

    /* Result animation */
    .result-text {
      animation: slideIn 0.3s ease-out;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.5);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(167, 139, 250, 0.8);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-100 dark:from-slate-950 dark:via-purple-950 dark:to-slate-900 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

<div class="w-full max-w-2xl">
  <div class="card rounded-3xl shadow-2xl p-8 space-y-6 animate-fade-in">
    
    <!-- HEADER -->
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
          📚 So'z Yodlash
        </h1>
        <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">Miss Aziza uchun</p>
      </div>
      <button id="darkToggle" class="p-3 rounded-full bg-purple-100 dark:bg-purple-900 hover:bg-purple-200 dark:hover:bg-purple-800 transition-colors">
        🌙
      </button>
    </div>

    <!-- TIMER -->
    <div class="text-center">
      <p id="timer" class="text-2xl font-bold text-purple-600 dark:text-purple-400">⏱ 00:00</p>
    </div>

    <!-- ADD WORD PAGE -->
    <div id="addPage" class="space-y-5 animate-slide-in">
      <h2 class="text-xl font-semibold text-slate-800 dark:text-white">✍️ So'z qo'shish</h2>
      
      <div class="space-y-3">
        <input id="enInput" placeholder="Inglizcha so'z" class="w-full px-4 py-3 rounded-xl border border-purple-200 dark:border-purple-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-purple-500">
        <input id="uzInput" placeholder="O'zbekcha tarjima" class="w-full px-4 py-3 rounded-xl border border-purple-200 dark:border-purple-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-purple-500">
        
        <button id="addWord" class="w-full px-4 py-3 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold rounded-xl shadow-lg transition-all">
          ➕ So'z qo'shish
        </button>
      </div>

      <div class="bg-purple-50 dark:bg-purple-900 rounded-xl p-4 text-center">
        <p id="count" class="text-lg font-semibold text-purple-700 dark:text-purple-300">0 ta so'z qo'shildi</p>
      </div>

      <button id="confirm" class="w-full px-4 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg transition-all">
        ✅ Testni boshlash
      </button>
    </div>

    <!-- TEST PAGE -->
    <div id="testPage" class="hidden space-y-5 animate-slide-in">
      <h2 class="text-xl font-semibold text-slate-800 dark:text-white">📝 Test</h2>

      <!-- PROGRESS BAR -->
      <div class="space-y-2">
        <div class="flex justify-between text-xs text-slate-600 dark:text-slate-400">
          <span id="progressText">0/0</span>
          <span id="scoreDisplay">0% ✅</span>
        </div>
        <div class="w-full h-3 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
          <div id="progressFill" class="progress-bar h-full w-0"></div>
        </div>
      </div>

      <!-- TEST WORD -->
      <div class="bg-gradient-to-r from-purple-100 to-pink-100 dark:from-purple-900 dark:to-pink-900 rounded-2xl p-6 text-center">
        <p class="text-slate-600 dark:text-slate-300 text-sm mb-2">Tarjima qilinsin:</p>
        <p id="testWord" class="text-3xl font-bold text-slate-800 dark:text-white"></p>
      </div>

      <!-- INPUT AND BUTTONS -->
      <div class="space-y-3">
        <input id="testInput" placeholder="Tarjimasini yozing..." class="w-full px-4 py-3 rounded-xl border border-purple-200 dark:border-purple-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-purple-500">
        
        <button id="check" class="w-full px-4 py-3 bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-semibold rounded-xl shadow-lg transition-all">
          ✓ Tekshirish
        </button>
      </div>

      <!-- RESULT -->
      <div id="resultContainer" class="min-h-12"></div>

      <!-- NEXT BUTTON -->
      <button id="next" class="w-full px-4 py-3 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-semibold rounded-xl shadow-lg transition-all">
        → Keyingi so'z
      </button>

      <!-- FINISH BLOCK -->
      <div id="finishBlock" class="hidden space-y-4 text-center bg-gradient-to-r from-green-50 to-emerald-50 dark:from-green-900 dark:to-emerald-900 rounded-2xl p-6">
        <p id="scoreText" class="text-2xl font-bold text-green-600 dark:text-green-400"></p>
        <button id="restart" class="w-full px-4 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-semibold rounded-xl shadow-lg transition-all">
          🔁 Yangi boshlash
        </button>
        <button id="showLearned" class="w-full px-4 py-3 bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-semibold rounded-xl shadow-lg transition-all">
          📚 O'rganilgan so'zlar
        </button>
      </div>
    </div>

    <!-- LEARNED WORDS PAGE -->
    <div id="learnedPage" class="hidden space-y-4 animate-slide-in">
      <h2 class="text-xl font-semibold text-center text-slate-800 dark:text-white">📚 O'rganilgan so'zlar</h2>
      <ul id="learnedList" class="space-y-2 max-h-80 overflow-y-auto bg-slate-50 dark:bg-slate-800 rounded-2xl p-4"></ul>
      <button id="backHome" class="w-full px-4 py-3 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-semibold rounded-xl shadow-lg transition-all">
        ⬅️ Orqaga
      </button>
    </div>

    <!-- TELEGRAM LINK -->
    <a href="https://t.me/ms_faxriddinovna" target="_blank" class="block text-center px-4 py-3 bg-gradient-to-r from-blue-500 to-cyan-500 hover:from-blue-600 hover:to-cyan-600 text-white font-semibold rounded-xl shadow-lg transition-all">
      📢 Telegram kanalga obuna bo'lish
    </a>

  </div>
</div>

<script>
  // ============ STATE ============
  let words = JSON.parse(localStorage.getItem("words")) || [];
  let learnedWords = JSON.parse(localStorage.getItem("learnedWords")) || [];
  let wrongWords = [];
  let index = 0;
  let score = 0;
  let startTime;
  let timerInterval;

  // ============ DOM ELEMENTS ============
  const addPage = document.getElementById("addPage");
  const testPage = document.getElementById("testPage");
  const learnedPage = document.getElementById("learnedPage");

  const enInput = document.getElementById("enInput");
  const uzInput = document.getElementById("uzInput");
  const testInput = document.getElementById("testInput");

  const addWordBtn = document.getElementById("addWord");
  const confirmBtn = document.getElementById("confirm");
  const checkBtn = document.getElementById("check");
  const nextBtn = document.getElementById("next");
  const restartBtn = document.getElementById("restart");
  const showLearnedBtn = document.getElementById("showLearned");
  const backHomeBtn = document.getElementById("backHome");
  const darkToggle = document.getElementById("darkToggle");

  const countEl = document.getElementById("count");
  const testWordEl = document.getElementById("testWord");
  const resultContainer = document.getElementById("resultContainer");
  const finishBlock = document.getElementById("finishBlock");
  const scoreText = document.getElementById("scoreText");
  const learnedList = document.getElementById("learnedList");
  const progressFill = document.getElementById("progressFill");
  const timerEl = document.getElementById("timer");
  const progressText = document.getElementById("progressText");
  const scoreDisplay = document.getElementById("scoreDisplay");

  // ============ ADD WORD ============
  addWordBtn.onclick = () => {
    const en = enInput.value.trim();
    const uz = uzInput.value.trim();
    if (!en || !uz) {
      alert("Iltimos, inglizcha so'z va o'zbekcha tarjimani kiriting");
      return;
    }
    words.push({ en, uz });
    localStorage.setItem("words", JSON.stringify(words));
    enInput.value = "";
    uzInput.value = "";
    countEl.textContent = `${words.length} ta so'z qo'shildi`;
  };

  // ============ START TEST ============
  confirmBtn.onclick = () => {
    if (words.length === 0) {
      alert("Iltimos, avval kamita bitta so'z qo'shing");
      return;
    }
    addPage.classList.add("hidden");
    testPage.classList.remove("hidden");
    index = 0;
    score = 0;
    wrongWords = [];
    finishBlock.classList.add("hidden");
    nextBtn.classList.remove("hidden");
    checkBtn.classList.remove("hidden");

    startTime = Date.now();
    timerInterval = setInterval(() => {
      const elapsed = Date.now() - startTime;
      const minutes = Math.floor(elapsed / 60000).toString().padStart(2, '0');
      const seconds = Math.floor((elapsed % 60000) / 1000).toString().padStart(2, '0');
      timerEl.textContent = `⏱ ${minutes}:${seconds}`;
    }, 1000);

    showTestWord();
    updateProgress();
  };

  // ============ SHOW TEST WORD ============
  function showTestWord() {
    testWordEl.textContent = words[index].en;
    testInput.value = "";
    resultContainer.innerHTML = "";
    testInput.focus();
  }

  // ============ CHECK ANSWER ============
  checkBtn.onclick = () => {
    const answer = testInput.value.trim().toLowerCase();
    const correct = words[index].uz.toLowerCase();
    
    if (answer === correct) {
      const resultEl = document.createElement("p");
      resultEl.textContent = "✅ To'g'ri! Zo'r!";
      resultEl.className = "result-text text-center font-bold text-lg text-green-600 dark:text-green-400 py-3";
      resultContainer.innerHTML = "";
      resultContainer.appendChild(resultEl);
      
      learnedWords.push(words[index]);
      score++;
      localStorage.setItem("learnedWords", JSON.stringify(learnedWords));
    } else {
      const resultEl = document.createElement("div");
      resultEl.className = "result-text bg-red-50 dark:bg-red-900 border-2 border-red-300 dark:border-red-700 rounded-xl p-4 text-center";
      resultEl.innerHTML = `
        <p class="font-bold text-red-600 dark:text-red-400 mb-2">❌ Noto'g'ri</p>
        <p class="text-sm text-red-700 dark:text-red-300">To'g'ri javob: <span class="font-bold">${correct}</span></p>
      `;
      resultContainer.innerHTML = "";
      resultContainer.appendChild(resultEl);
      
      wrongWords.push({ ...words[index], wrong: true });
    }
    updateProgress();
  };

  // ============ NEXT WORD ============
  nextBtn.onclick = () => {
    index++;
    if (index >= words.length) {
      if (wrongWords.length > 0) {
        words = wrongWords;
        wrongWords = [];
        index = 0;
        resultContainer.innerHTML = "";
      } else {
        finishBlock.classList.remove("hidden");
        nextBtn.classList.add("hidden");
        checkBtn.classList.add("hidden");
        const totalAttempts = score + learnedWords.length;
        scoreText.textContent = `🎉 Tabriklaymiz!\n${score}/${totalAttempts} to'g'ri javob`;
        clearInterval(timerInterval);
      }
    }
    showTestWord();
    updateProgress();
  };

  // ============ UPDATE PROGRESS ============
  function updateProgress() {
    const percent = words.length > 0 ? (index / words.length) * 100 : 0;
    progressFill.style.width = percent + "%";
    progressText.textContent = `${index}/${words.length}`;
    const scorePercent = words.length > 0 ? Math.round((score / words.length) * 100) : 0;
    scoreDisplay.textContent = `${scorePercent}% ✅`;
  }

  // ============ RESTART ============
  restartBtn.onclick = () => {
    testPage.classList.add("hidden");
    addPage.classList.remove("hidden");
    words = [];
    learnedWords = [];
    wrongWords = [];
    localStorage.setItem("words", JSON.stringify(words));
    localStorage.setItem("learnedWords", JSON.stringify(learnedWords));
    countEl.textContent = "0 ta so'z qo'shildi";
    timerEl.textContent = "⏱ 00:00";
  };

  // ============ SHOW LEARNED ============
  showLearnedBtn.onclick = () => {
    testPage.classList.add("hidden");
    learnedPage.classList.remove("hidden");
    learnedList.innerHTML = "";
    learnedWords.forEach(w => {
      const li = document.createElement("li");
      li.className = "px-4 py-3 rounded-lg bg-white dark:bg-slate-700 flex justify-between items-center";
      li.innerHTML = `
        <div>
          <p class="font-semibold text-slate-800 dark:text-white">${w.en}</p>
          <p class="text-sm text-slate-600 dark:text-slate-400">${w.uz}</p>
        </div>
        <span class="text-xl">${w.wrong ? "🔄" : "✅"}</span>
      `;
      learnedList.appendChild(li);
    });
  };

  // ============ BACK TO ADD PAGE ============
  backHomeBtn.onclick = () => {
    learnedPage.classList.add("hidden");
    addPage.classList.remove("hidden");
  };

  // ============ DARK MODE ============
  darkToggle.onclick = () => {
    document.documentElement.classList.toggle("dark");
    localStorage.setItem("darkMode", document.documentElement.classList.contains("dark"));
  };

  // Load dark mode preference
  if (localStorage.getItem("darkMode") === "true") {
    document.documentElement.classList.add("dark");
  }

  // Allow Enter key to submit
  testInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") {
      checkBtn.click();
    }
  });
</script>

</body>
</html>
